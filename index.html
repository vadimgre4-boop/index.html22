<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History Assistant MAX</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --accent: #ff4757;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #3f3f3f;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding-top: 115px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .header-fixed {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
            z-index: 1000;
        }

        .search-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .search-bar:focus { border-color: var(--accent); }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 5px 0;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .f-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            cursor: pointer;
        }
        .f-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .content { padding: 5px 10px 20px; }

        .card {
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-title span { color: var(--accent); margin-left: 4px; font-size: 14px;}

        .card-body {
            display: none;
            padding: 12px 15px;
            background: #252525;
            border-top: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-dim);
        }

        .card.open .card-body { display: block; }
        .card.open { border-color: var(--accent); }

        .no-data { text-align: center; color: var(--text-dim); padding: 40px; }
        .arrow { font-size: 10px; color: #666; transition: transform 0.2s; }
        .card.open .arrow { transform: rotate(180deg); }
    </style>
</head>
<body>

<div class="header-fixed">
    <input type="text" id="search" class="search-bar" placeholder="Поиск (событие, дата, символы)..." autocomplete="off">
    <div class="filters">
        <button class="f-btn active" onclick="setFilter('Все', this)">Все</button>
        <button class="f-btn" onclick="setFilter('16 век', this)">16 век</button>
        <button class="f-btn" onclick="setFilter('17 век', this)">17 век</button>
        <button class="f-btn" onclick="setFilter('Мир', this)">🌍 Мир</button>
        <button class="f-btn" onclick="setFilter('Урал', this)">🏔️ Урал</button>
        <button class="f-btn" onclick="setFilter('Дата', this)">📅 Даты</button>
        <button class="f-btn" onclick="setFilter('Деятель', this)">👤 Деятели</button>
        <button class="f-btn" onclick="setFilter('Термин', this)">📖 Термины</button>
    </div>
</div>

<div class="content" id="list"></div>

    ];

    let currentTag = 'Все';

    // Функция проверки, является ли строка поиска подпоследовательностью в строке-цели
    function isSubsequence(search, target) {
        let searchIdx = 0;
        let targetIdx = 0;
        while (searchIdx < search.length && targetIdx < target.length) {
            if (search[searchIdx] === target[targetIdx]) {
                searchIdx++;
            }
            targetIdx++;
        }
        return searchIdx === search.length;
    }

    // Обновленный "умный" поиск
    function smartSearch(item, query) {
        if (!query.trim()) return true;
        const target = (item.name + " " + item.date + " " + item.info).toLowerCase();
        const words = query.toLowerCase().trim().split(/\s+/);
        
        // Для каждого введенного слова проверяем, размазаны ли его буквы по тексту
        return words.every(word => isSubsequence(word, target));
    }

    function render() {
        const list = document.getElementById('list');
        const query = document.getElementById('search').value;
        list.innerHTML = '';
        
        const filtered = historyDB.filter(item => {
            const matchesSearch = smartSearch(item, query);
            const matchesTag = currentTag === 'Все' || item.tags.includes(currentTag);
            return matchesSearch && matchesTag;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div class="no-data">Ничего не найдено</div>`;
            return; 
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header" onclick="toggleCard(this)">
                    <div class="card-title">${item.name} <span>${item.date ? '('+item.date+')' : ''}</span></div>
                    <div class="arrow">▼</div>
                </div>
                <div class="card-body">
                    ${item.info}
                </div>
            `;
            list.appendChild(card);
        });
    }

    function toggleCard(header) {
        const card = header.parentElement;
        const isOpen = card.classList.contains('open');
        document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
        if (!isOpen) card.classList.add('open');
    }

    function setFilter(tag, btn) {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTag = tag;
        render();
    }

    document.getElementById('search').addEventListener('input', render);
    render();
</script>
