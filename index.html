<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History Assistant v2.0</title>
    <style>
        /* СТИЛИ: Тёмная тема для скрытности */
        :root {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --accent: #ff4757;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #3f3f3f;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding-top: 110px; /* Место для шапки */
            -webkit-tap-highlight-color: transparent;
        }

        /* Фиксированная шапка */
        .header-fixed {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
            z-index: 1000;
        }

        /* Поле поиска */
        .search-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .search-bar:focus { border-color: var(--accent); }

        /* Фильтры (овальные кнопки) */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .f-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            cursor: pointer;
        }
        .f-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Список элементов */
        .content { padding: 0 10px 20px; }

        .card {
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-title span { color: var(--accent); margin-left: 5px; }

        .card-body {
            display: none;
            padding: 12px 15px;
            background: #252525;
            border-top: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-dim);
        }

        .card.open .card-body { display: block; }
        .card.open { border-color: var(--accent); }

        .no-data { text-align: center; color: var(--text-dim); padding: 40px; }
    </style>
</head>
<body>

    <div class="header-fixed">
        <input type="text" id="search" class="search-bar" placeholder="Поиск (дата или слово)..." autocomplete="off">
<div class="filters">
    <button class="filter-btn active" data-filter="Все">Все</button>
    <button class="filter-btn" data-filter="16 век">16 век</button>
    <button class="filter-btn" data-filter="17 век">17 век</button>
    <button class="filter-btn" data-filter="Зарубежье">Зарубежье</button>
    <button class="filter-btn" data-filter="Картинка">Картинки</button>
    <button class="filter-btn" data-filter="Термин">Термины</button>
    <button class="filter-btn" data-filter="Деятель">Деятели</button>
    <button class="filter-btn" data-filter="Дата">Даты</button>
</div>
    </div>

    <div class="content" id="list">
        </div>

<script>
    // ==========================================
    // ПОЛЕ ДЛЯ ТВОИХ ДАННЫХ (МАССИВ)
    // ==========================================
    const historyDB = [
        { name: "Опричнина", date: "1565-1572", info: "Личный удел царя Ивана Грозного с особым управлением, войском и территорией. Цель: борьба с боярской оппозицией.", tags: ["Россия", "Термин"] },
        { name: "Варфоломеевская ночь", date: "1572", info: "Массовое избиение гугенотов (протестантов) во Франции, организованное католиками.", tags: ["Мир"] },
        { name: "Михаил Романов", date: "1613", info: "Первый царь из династии Романовых. Избран Земским собором, положил конец Смутному времени.", tags: ["Россия", "Деятель"] },
        { name: "Соборное уложение", date: "1649", info: "Свод законов России, принятый при Алексее Михайловиче. Установил бессрочный сыск беглых крестьян (крепостное право).", tags: ["Россия", "Термин"] },
        // СЮДА ДОБАВЛЯЙ НОВЫЕ СТРОКИ
    ];

    // ==========================================
    // ЛОГИКА ПРИЛОЖЕНИЯ (НЕ ТРОГАТЬ)
    // ==========================================
    let currentTag = 'Все';

    function render() {
        const list = document.getElementById('list');
        const query = document.getElementById('search').value.toLowerCase();
        list.innerHTML = '';

        // Сортировка по алфавиту
        const sortedDB = [...historyDB].sort((a, b) => a.name.localeCompare(b.name));

        const filtered = sortedDB.filter(item => {
            const matchesSearch = item.name.toLowerCase().includes(query) || 
                                  item.date.toLowerCase().includes(query) || 
                                  item.info.toLowerCase().includes(query);
            const matchesTag = currentTag === 'Все' || item.tags.includes(currentTag);
            return matchesSearch && matchesTag;
        });

        if (filtered.length === 0) {
            list.innerHTML = '<div class="no-data">Ничего не найдено</div>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header" onclick="toggleCard(this)">
                    <div class="card-title">${item.name} <span>(${item.date})</span></div>
                    <div style="font-size:10px; color:#666">▼</div>
                </div>
                <div class="card-body">${item.info}</div>
            `;
            list.appendChild(card);
        });
    }

    function toggleCard(header) {
        header.parentElement.classList.toggle('open');
    }

    function filter(tag, btn) {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTag = tag;
        render();
    }

    document.getElementById('search').addEventListener('input', render);
    
    // Первая отрисовка
    render();
</script>
</body>
</html>
