<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History Assistant v2.0</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --accent: #ff4757;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #3f3f3f;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding-top: 115px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Фиксированная панель управления */
        .header-fixed {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
            z-index: 1000;
        }

        .search-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus { border-color: var(--accent); }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 5px 0;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .f-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .f-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Контент */
        .content { padding: 5px 10px 20px; }

        .card {
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .card-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-title span { color: var(--accent); font-size: 14px; }

        .card-body {
            display: none;
            padding: 12px 15px;
            background: #252525;
            border-top: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-dim);
        }

        .card.open .card-body { display: block; }
        .card.open { border-color: var(--accent); }

        .tag-label {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .no-data { text-align: center; color: var(--text-dim); padding: 40px; font-size: 14px; }
        
        .arrow { font-size: 10px; color: #666; transition: transform 0.2s; }
        .card.open .arrow { transform: rotate(180deg); }
    </style>
</head>
<body>

    <div class="header-fixed">
        <input type="text" id="search" class="search-bar" placeholder="Поиск (н-р: ивнгроз)..." autocomplete="off">
        <div class="filters">
            <button class="f-btn active" onclick="setFilter('Все', this)">Все</button>
            <button class="f-btn" onclick="setFilter('Россия', this)">🇷🇺 Россия</button>
            <button class="f-btn" onclick="setFilter('Мир', this)">🌍 Мир</button>
            <button class="f-btn" onclick="setFilter('Дата', this)">📅 Даты</button>
            <button class="f-btn" onclick="setFilter('Деятель', this)">👤 Деятели</button>
            <button class="f-btn" onclick="setFilter('Термин', this)">📖 Термины</button>
        </div>
    </div>

    <div class="content" id="list"></div>

<script>
    // Твои данные будут здесь
    const historyDB = [
    // --- РОССИЯ (XVI век) ---
    { name: "Венчание на царство (1547)", date: "", info: "Иван IV первым официально принял титул царя в Успенском соборе. Это подняло авторитет России на международной арене.", tags: ["Россия", "Дата"] },
    { name: "Избранная рада (1549-1560)", date: "", info: "Круг близких советников царя (Адашев, Сильвестр). Провели ключевые реформы: создали приказы, стрельцов и ограничили местничество.", tags: ["Россия", "Деятель", "Термин"] },
    { name: "Земский собор (1549)", date: "", info: "Первый в истории России сословно-представительный орган. Собрание представителей разных сословий для решения важных дел государства.", tags: ["Россия", "Термин"] },
    { name: "Судебник Ивана IV (1550)", date: "", info: "Новый сборник законов. Усилил центральную власть, увеличил 'пожилое' для крестьян, что затруднило их уход от помещиков.", tags: ["Россия", "Термин"] },
    { name: "Стрелецкое войско (1550)", date: "", info: "Первое постоянное войско, вооруженное огнестрельным оружием (пищалями). Получали жалованье и жили в отдельных слободах.", tags: ["Россия", "Термин"] },
    { name: "Стоглавый собор (1551)", date: "", info: "Собрание духовенства, принявшее 'Стоглав'. Унифицировали церковные обряды и правила поведения для священников.", tags: ["Россия", "Термин"] },
    { name: "Взятие Казани (1552)", date: "", info: "После долгих осад Казань пала. Ликвидировано Казанское ханство, открыт путь по Волге и на Урал.", tags: ["Россия", "Дата"] },
    { name: "Взятие Астрахани (1556)", date: "", info: "Бескровное присоединение. Россия получила контроль над всем Каспийским путем.", tags: ["Россия", "Дата"] },
    { name: "Опричнина (1565-1572)", date: "", info: "Политика террора и разделения страны на две части. Цель — уничтожить власть бояр и установить единоличную власть царя.", tags: ["Россия", "Термин"] },
    { name: "Ливонская война (1558-1583)", date: "", info: "Борьба за выход к Балтийскому морю. Противники: Литва, Польша, Швеция. Закончилась поражением и потерей крепостей Ям и Копорье.", tags: ["Россия", "Дата"] },
    { name: "Заповедные лета (1581)", date: "", info: "Указ, временно запрещающий переход крестьян в Юрьев день. Важный шаг к крепостному праву.", tags: ["Россия", "Термин"] },

    // --- ИСТОРИЯ УРАЛА (XVI век) ---
    { name: "Строгановы (1558)", date: "", info: "Богатейшие купцы, получившие от царя грамоты на земли по Каме и Чусовой. Развивали добычу соли и железа на Урале.", tags: ["Россия", "Урал", "Деятель"] },
    { name: "Поход Ермака (1581-1585)", date: "", info: "Казачий отряд на средства Строгановых разбил Сибирское ханство хана Кучума. Начало вхождения Урала и Сибири в состав России.", tags: ["Россия", "Урал", "Деятель"] },
    { name: "Орел-городок (1564)", date: "", info: "Опорный пункт Строгановых на Каме. Отсюда начинались многие экспедиции за Уральские горы.", tags: ["Россия", "Урал"] },
    { name: "Соль Камская (1558)", date: "", info: "Центр солеварения на Урале. Соль была главным богатством региона в этот период.", tags: ["Россия", "Урал", "Термин"] },

    // --- ВСЕМИРНАЯ ИСТОРИЯ (XVI век) ---
    { name: "95 тезисов Лютера (1517)", date: "", info: "Начало Реформации в Германии. Выступление против продажи индульгенций и власти Папы Римского.", tags: ["Мир", "Дата", "Деятель"] },
    { name: "Кругосветка Магеллана (1519-1522)", date: "", info: "Первое кругосветное плавание. Доказало, что Земля — шар и океаны связаны.", tags: ["Мир", "Дата"] },
    { name: "Орден Иезуитов (1534)", date: "", info: "Создан Игнатием Лойолой для защиты католичества и борьбы с протестантами. Занимались образованием и шпионажем.", tags: ["Мир", "Термин"] },
    { name: "Англиканская церковь (1534)", date: "", info: "Король Генрих VIII провозгласил себя главой церкви Англии, разорвав отношения с Папой Римским.", tags: ["Мир", "Термин"] },
    { name: "Варфоломеевская ночь (1572)", date: "", info: "Массовое убийство гугенотов (протестантов) в Париже. Религиозные войны во Франции.", tags: ["Мир", "Дата"] },
    { name: "Нантский эдикт (1598)", date: "", info: "Указ Генриха IV, давший протестантам права во Франции. Конец религиозных войн.", tags: ["Мир", "Дата"] },
    { name: "Непобедимая армада (1588)", date: "", info: "Огромный флот Испании, посланный на захват Англии, но разгромленный штормом и английскими моряками.", tags: ["Мир", "Дата"] }
];

    let currentTag = 'Все';

    // Умный поиск: игнорирует пробелы, регистр и ищет вхождения частей слов
    function fuzzyMatch(item, query) {
        const target = (item.name + item.date + item.info + item.tags.join('')).toLowerCase().replace(/\s/g, '');
        const searchParts = query.toLowerCase().trim().split(/\s+/);
        
        return searchParts.every(part => {
            const cleanPart = part.replace(/\s/g, '');
            return target.includes(cleanPart);
        });
    }

    function render() {
        const list = document.getElementById('list');
        const query = document.getElementById('search').value;
        list.innerHTML = '';

        // Сортировка по алфавиту для удобства
        const sortedDB = [...historyDB].sort((a, b) => a.name.localeCompare(b.name));

        const filtered = sortedDB.filter(item => {
            const matchesSearch = fuzzyMatch(item, query);
            const matchesTag = currentTag === 'Все' || item.tags.includes(currentTag);
            return matchesSearch && matchesTag;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div class="no-data">${query ? 'Ничего не найдено' : 'База данных пуста'}</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header" onclick="toggleCard(this)">
                    <div class="card-title">${item.name} <span>${item.date ? '('+item.date+')' : ''}</span></div>
                    <div class="arrow">▼</div>
                </div>
                <div class="card-body">
                    ${item.info}
                    <br>
                    <span class="tag-label">#${item.tags.join(' #')}</span>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function toggleCard(header) {
        const card = header.parentElement;
        const isOpen = card.classList.contains('open');
        
        // Закрыть другие карточки при открытии новой (опционально, для экономии места)
        document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
        
        if (!isOpen) card.classList.add('open');
    }

    function setFilter(tag, btn) {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTag = tag;
        render();
    }

    document.getElementById('search').addEventListener('input', render);
    
    // Инициализация
    render();
</script>
</body>
</html>
