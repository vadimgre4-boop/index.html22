<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History Assistant v2.0</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --accent: #ff4757;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #3f3f3f;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding-top: 115px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Фиксированная панель управления */
        .header-fixed {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
            z-index: 1000;
        }

        .search-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus { border-color: var(--accent); }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 5px 0;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .f-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .f-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Контент */
        .content { padding: 5px 10px 20px; }

        .card {
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .card-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-title span { color: var(--accent); font-size: 14px; }

        .card-body {
            display: none;
            padding: 12px 15px;
            background: #252525;
            border-top: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-dim);
        }

        .card.open .card-body { display: block; }
        .card.open { border-color: var(--accent); }

        .tag-label {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .no-data { text-align: center; color: var(--text-dim); padding: 40px; font-size: 14px; }
        
        .arrow { font-size: 10px; color: #666; transition: transform 0.2s; }
        .card.open .arrow { transform: rotate(180deg); }
    </style>
</head>

    { name: "Династия Цин (1644)", info: "Маньчжурская династия, захватившая власть в Китае. Также перешли к изоляции страны от иностранцев.", img: "", tags: ["Мир", "Термин"] },

    let currentTag = 'Все';

   // Ультра-поиск: ищет по отдельным разбросанным буквам в любом порядке
    function fuzzyMatch(item, query) {
        // Склеиваем весь текст карточки в одну строку и переводим в нижний регистр
        let target = (item.name + (item.date || '') + item.info + item.tags.join('')).toLowerCase();
        
        // Убираем из запроса все пробелы и переводим в нижний регистр
        const cleanQuery = query.toLowerCase().replace(/\s/g, '');

        // Проходимся по каждой букве из твоего запроса
        for (let char of cleanQuery) {
            // Ищем эту букву в тексте карточки
            const index = target.indexOf(char);
            
            if (index !== -1) {
                // Если буква нашлась, "вырезаем" её из текста, 
                // чтобы не посчитать одну и ту же букву дважды (например, если ищешь "ааа")
                target = target.slice(0, index) + target.slice(index + 1);
            } else {
                // Если хотя бы одной буквы из запроса нет в карточке — совпадения нет
                return false;
            }
        }
        
        // Если цикл дошел до конца, значит все буквы нашлись
        return true;
    }

    function render() {
    const list = document.getElementById('list');
    const query = document.getElementById('search').value;
        list.innerHTML=";
        
        // Сортировка по алфавиту для удобства
        const sortedDB = [...historyDB].sort((a, b) => a.name.localeCompare(b.name));

        const filtered = sortedDB.filter(item => {
            const matchesSearch = fuzzyMatch(item, query);
            const matchesTag = currentTag === 'Все' || item.tags.includes(currentTag);
            return matchesSearch && matchesTag;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div class="no-data">${query ? 'Ничего не найдено' : 'База данных пуста'}</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header" onclick="toggleCard(this)">
                    <div class="card-title">${item.name} <span>${item.date ? '('+item.date+')' : ''}</span></div>
                    <div class="arrow">▼</div>
                </div>
                <div class="card-body">
                    ${item.info}
                    <br>
                    <span class="tag-label">#${item.tags.join(' #')}</span>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function toggleCard(header) {
        const card = header.parentElement;
        const isOpen = card.classList.contains('open');
    }
        
        // Закрыть другие карточки при открытии новой (опционально, для экономии места)
        document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
        
        if (!isOpen) card.classList.add('open');
    }

    function setFilter(tag, btn) {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTag = tag;
        render();
    }

    document.getElementById('search').addEventListener('input', render);
    
    // Инициализация
    render();
</script>
